<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalized Pragmatic App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="screen1">
        <div class="header">
            <div class="wordlings">
                <span class="brand">
                    <span></span><span></span>
                </span>

            </div>

    </div>

</html>
