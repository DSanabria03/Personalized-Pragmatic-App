[project]
name = "personalized-pragmatic-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]",
    "ollama",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
# Free local voice for Pip (Piper). Install with:  uv sync --extra voice
voice = ["piper-tts"]
